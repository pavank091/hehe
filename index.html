<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I'm Sorry ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top right, #ffe6e6, #ffffff);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      margin-top: 80px;
      font-size: 50px;
      color: #cc0000;
    }

    p {
      font-size: 22px;
      color: #333;
      margin-bottom: 40px;
    }

    audio {
      margin-top: 20px;
      width: 300px;
      outline: none;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      top: -10%;
      left: 50%;
      animation: fall 5s infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes fall {
      0% {
        top: -10%;
        opacity: 1;
        transform: translateX(0) rotate(45deg);
      }
      100% {
        top: 110%;
        opacity: 0;
        transform: translateX(100px) rotate(45deg);
      }
    }
  </style>
</head>
<body>

  <h1>I’m Sorry(Dil Se)❤️</h1>
  <p>You mean the world to me. Please forgive me, my Rasmalai✨. 🥺</p>

  <audio id="audioPlayer" controls autoplay>
    <source src="128-Dagabaaz Re - Dabangg 2 128 Kbps.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    window.onload = function() {
      alert("I'm really sorry. I never meant to hurt you. 🥺💔");

      var audio = document.getElementById('audioPlayer');
      audio.addEventListener('loadedmetadata', function() {
        audio.currentTime = 100; // Start at 1 minute 40 seconds
        audio.play();
      });

      // Create falling hearts
      setInterval(function() {
        var heart = document.createElement('div');
        heart.className = 'heart';
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 2 + 3) + "s"; // Random fall speed
        document.body.appendChild(heart);

        setTimeout(function() {
          heart.remove();
        }, 5000);
      }, 300);
    }
  </script>

</body>
</html>
